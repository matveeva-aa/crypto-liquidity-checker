<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Проверка ликвидности токена</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    input {
      font-size: 1rem;
      padding: 0.4rem;
      width: 60%;
    }
    button {
      font-size: 1rem;
      padding: 0.4rem 1rem;
      margin-left: 0.5rem;
    }
    pre {
      margin-top: 1rem;
      background: #f5f5f5;
      padding: 1rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    span.green { color: green; }
    span.red { color: red; }
  </style>
  <script>
    const server = 'https://liquidity-api-qkhg.onrender.com';

    async function fetchData() {
      const contractInput = document.getElementById('contract').value.trim();
      const output = document.getElementById('output');
      output.textContent = 'Загрузка...';

      if (!contractInput) {
        output.textContent = '❗ Пожалуйста, вставьте адрес контракта или ссылку на пару';
        return;
      }

      const isLink = contractInput.includes('mexc.com');
      let address = '';
      if (isLink) {
        const parts = contractInput.split('/exchange/')[1];
        if (!parts) {
          output.textContent = '❗ Неверный формат ссылки на MEXC.';
          return;
        }
        address = parts.split('_')[0].toLowerCase();
      } else {
        address = contractInput;
      }

      try {
        const symbolRes = await fetch(`${server}/get_symbol?address=${address}`);
        if (!symbolRes.ok) {
          output.textContent = '❌ Пара не найдена. Вставьте правильный адрес контракта или ссылку на MEXC.';
          return;
        }

        const symbolData = await symbolRes.json();
        const symbol = symbolData.symbol.toUpperCase();

        const orderbookRes = await fetch(`${server}/get_orderbook?symbol=${symbol}`);
        const { depth, ticker } = await orderbookRes.json();

        const bids = (depth?.bids || []).map(([p, q]) => [parseFloat(p), parseFloat(q)]);
        if (bids.length < 16) {
          output.textContent = 'Недостаточно данных в стакане для анализа.';
          return;
        }

        const topBid = bids[0][0];
        const bottomBid = bids[15][0];

        const spread = ((topBid - bottomBid) / bottomBid) * 100;
        const spreadText = spread.toFixed(2).replace('.', ',');

        const formulaText = `( ${topBid} - ${bottomBid} ) / ${bottomBid} × 100`;

        const liquidity = bids
                .slice(0, 16)
                .reduce((sum, [p, q]) => sum + p * q, 0)
                .toFixed(2)
                .replace(/\B(?=(\d{3})+(?!\d))/g, "'");

        const dailyVol = parseFloat(ticker?.quoteVolume || 0)
                .toFixed(0)
                .replace(/\B(?=(\d{3})+(?!\d))/g, "'");

        const spreadColor = Math.abs(spread) <= 10 ? 'green' : 'red';
        const liquidityColor = liquidity >= 3000 ? 'green' : 'red';
        const volumeColor = dailyVol >= 10000 ? 'green' : 'red';

        output.innerHTML = `
          <div><strong>Пара:</strong> ${symbol} / USDT</div>
          <div><strong>Макс. ордер на покупку:</strong> ${topBid}</div>
          <div><strong>Мин. ордер на покупку:</strong> ${bottomBid}</div>
          <div><strong>Формула:</strong> ${formulaText}</div>
          <div><strong>Разница в %:</strong> <span class="${spreadColor}">${spreadText}%</span></div>
          <div><strong>Ликвидность 1–16 ордеров (покупка):</strong> <span class="${liquidityColor}">${liquidity} USDT</span></div>
          <div><strong>Объем за сутки:</strong> <span class="${volumeColor}">${dailyVol} USDT</span></div>
        `;
      } catch (e) {
        output.textContent = '⚠️ Ошибка: ' + e.message;
      }
    }

    window.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        fetchData();
      }
    });
  </script>
</head>
<body>
<h2>Проверка ликвидности токена</h2>
<label>Контракт или ссылка на пару (MEXC):</label><br />
<input id="contract" type="text" placeholder="0x... или https://mexc.com/ru-RU/exchange/SHIRO_USDT" />
<button onclick="fetchData()">Проверить</button>
<pre id="output"></pre>
</body>
</html>
